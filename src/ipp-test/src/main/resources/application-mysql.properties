# Usage: When starting, add the parameter --spring.profiles.active=mysql
# Or set the Active profiles in the IDE runtime configuration: mysql
# Before Use: First create a database in MySQL with the command "CREATE DATABASE ipp_test;"

# Fill in the database connection details in this document (the password field must be filled in; the URL and database name can be modified as needed)
spring.datasource.url=xxxxxxx
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=xxxxxx
spring.datasource.password=xxxxxx

# Connection to an existing database, table already exists: Do not execute data.sql every time you start the application, otherwise it will insert data repeatedly (93 rows become 280 rows)
# Set to never: Do not execute schema.sql / data.sql, use the existing tables and data in the database
spring.sql.init.mode=never

# MyBatis configuration remains unchanged
mybatis.type-aliases-package=com.example.ipptest.domain
mybatis.mapper-locations=classpath:mappers/*.xml

# Close H2 console (no need after using MySQL)
spring.h2.console.enabled=false

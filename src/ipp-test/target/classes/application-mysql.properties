# 使用方式：启动时加参数 --spring.profiles.active=mysql
# 或在 IDE 运行配置里设置 Active profiles: mysql
# 使用前：在 MySQL 中先建库 CREATE DATABASE ipp_test;

# 在「本文件」填写数据库连接（下方 password 必填，url/库名可按需改）
spring.datasource.url=xxxxxxx
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=xxxxxx
spring.datasource.password=xxxxxx

# 连接已有库、表已存在时：不要每次启动都执行 data.sql，否则会重复插入（93 行变 280 行）
# 设为 never：不执行 schema.sql / data.sql，完全使用库里已有表和数据
spring.sql.init.mode=never

# MyBatis 不变
mybatis.type-aliases-package=com.example.ipptest.domain
mybatis.mapper-locations=classpath:mappers/*.xml

# 关闭 H2 控制台（改用 MySQL 后不需要）
spring.h2.console.enabled=false

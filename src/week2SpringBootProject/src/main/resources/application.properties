# Server configuration
server.port=8080
server.servlet.context-path=/

# Thymeleaf configuration
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html

# Development tool configuration
spring.devtools.restart.enabled=true
spring.devtools.restart.additional-paths=src/main/java

# Security configuration
spring.security.user.name=Dawn
spring.security.user.password=666666

# Database connection information
spring.datasource.url=xxxxxxxx
spring.datasource.username=root
spring.datasource.password=xxxxxxx

# JPA Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Disable the automatic naming strategy of Hibernate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl

spring.jpa.hibernate.ddl-auto=update

# Mail Configuration
spring.mail.host=smtp.qq.com
spring.mail.port=587
spring.mail.username=xxxxx@qq.com
spring.mail.password=xxxxxxx
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Application Email Settings
app.email.from=xxxxxx@qq.com
app.email.subject=Registration Successful

# MyBatis Configuration
mybatis.mapper-locations=classpath:mappers/*.xml
mybatis.type-aliases-package=com.example.loginsystem.model
mybatis.configuration.map-underscore-to-camel-case=true

# MyBatis Logging
logging.level.com.example.loginsystem.mapper=debug

# MyBatis Cache Configuration
mybatis.configuration.cache-enabled=true
